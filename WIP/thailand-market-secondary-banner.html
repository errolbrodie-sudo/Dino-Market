<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thailand Market Secondary Page Banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       SECONDARY E-COMMERCE PAGE BANNER — THAILAND MARKET (ULTRA-FLAT)
       Desktop: 1440 x 150px | Tablet: 768 x 130px | Mobile: 375 x 165px
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    body {
      background-color: #F1F4F8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .th-secondary-banner {
      position: relative;
      display: flex;
      width: 100%;
      max-width: 1440px;
      height: 150px;
      background-color: #EFC669;
      border: 1px solid #CBD6E4;
      overflow: hidden;
    }

    /* Left Marketing Zone (52%) with 9-Step Siamese Silk-Ivory to Thai Temple-Gold Background */
    .th-banner-left {
      position: relative;
      z-index: 2;
      flex: 0 0 52%;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 28px 0 44px;
      background: linear-gradient(
        90deg,
        #FFFEF9 0%,      #FFFEF9 11.11%,
        #FDF7E7 11.11%,  #FDF7E7 22.22%,
        #FBF0D5 22.22%,  #FBF0D5 33.33%,
        #F9E9C3 33.33%,  #F9E9C3 44.44%,
        #F7E2B1 44.44%,  #F7E2B1 55.55%,
        #F5DB9F 55.55%,  #F5DB9F 66.66%,
        #F3D48D 66.66%,  #F3D48D 77.77%,
        #F1CD7B 77.77%,  #F1CD7B 88.88%,
        #EFC669 88.88%,  #EFC669 100%
      );
    }

    /* Sharp Flat National Flag of Thailand (Trairanga) */
    .th-banner-flag {
      flex-shrink: 0;
      width: 64px;
      height: 42px;
      border: 1px solid rgba(31, 28, 61, 0.24);
      display: block;
    }

    /* Two-Color Marketing Heading */
    .th-banner-heading {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: #1F1C3D;
    }

    .th-banner-heading span {
      display: block;
      color: #A51931;
    }

    /* Right Raw Ingredients Zone (48%) */
    .th-banner-right {
      position: relative;
      flex: 0 0 48%;
      height: 100%;
      background-color: #EFC669;
      overflow: hidden;
    }

    /* Smooth Alpha Feather Blend from Left Step-Down Zone into Raw Ingredients */
    .th-banner-right::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 110px;
      background: linear-gradient(90deg, #EFC669 0%, rgba(239, 198, 105, 0) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* 5-Panel Editorial Collage of Raw Thai Ingredients */
    .th-ingredients-grid {
      display: grid;
      grid-template-columns: 1.15fr 1.05fr 0.9fr 0.9fr;
      grid-template-rows: 1fr 1fr;
      gap: 2px;
      width: 100%;
      height: 100%;
      background-color: #EFC669;
    }

    .ing-tile {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E5B958;
    }

    .ing-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.14) contrast(1.03);
    }

    /* Panel Layout Assignments */
    .ing-noodles    { grid-column: 1 / 2; grid-row: 1 / 3; }
    .ing-rice       { grid-column: 2 / 3; grid-row: 1 / 3; }
    .ing-lemongrass { grid-column: 3 / 4; grid-row: 1 / 2; }
    .ing-chillies   { grid-column: 3 / 4; grid-row: 2 / 3; }
    .ing-basil      { grid-column: 4 / 5; grid-row: 1 / 3; }

    /* Tablet Breakpoint (768 x 130px) */
    @media (max-width: 1024px) {
      .th-secondary-banner {
        height: 130px;
      }
      .th-banner-left {
        flex: 0 0 54%;
        gap: 16px;
        padding: 0 18px 0 24px;
      }
      .th-banner-flag {
        width: 52px;
        height: 34px;
      }
      .th-banner-heading {
        font-size: 16.5px;
      }
      .th-banner-right {
        flex: 0 0 46%;
      }
      .th-banner-right::before {
        width: 72px;
      }
    }

    /* Mobile Breakpoint (375 x 165px) */
    @media (max-width: 640px) {
      .th-secondary-banner {
        flex-direction: column;
        height: 165px;
      }
      .th-banner-left {
        flex: 0 0 54%;
        width: 100%;
        gap: 12px;
        padding: 10px 14px;
      }
      .th-banner-flag {
        width: 38px;
        height: 25px;
      }
      .th-banner-heading {
        font-size: 13px;
        line-height: 1.2;
      }
      .th-banner-right {
        flex: 0 0 46%;
        width: 100%;
      }
      .th-banner-right::before {
        inset: 0 0 auto 0;
        width: 100%;
        height: 22px;
        background: linear-gradient(180deg, #EFC669 0%, rgba(239, 198, 105, 0) 100%);
      }
      .th-ingredients-grid {
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: 1fr;
      }
      .ing-noodles    { grid-column: 1 / 2; grid-row: 1 / 2; }
      .ing-rice       { grid-column: 2 / 3; grid-row: 1 / 2; }
      .ing-lemongrass { grid-column: 3 / 4; grid-row: 1 / 2; }
      .ing-chillies   { grid-column: 4 / 5; grid-row: 1 / 2; }
      .ing-basil      { grid-column: 5 / 6; grid-row: 1 / 2; }
    }
  </style>
</head>
<body>

  <section class="th-secondary-banner" aria-label="A Taste of Thailand, Something for Every Home">
    <!-- Left Zone: Enlarged Flat National Flag of Thailand + Two-Color Heading on 9-Step Temple-Gold Background -->
    <div class="th-banner-left">
      <svg class="th-banner-flag" viewBox="0 0 900 600" role="img" aria-label="National Flag of Thailand">
        <!-- Top Crimson Red Stripe (1/6) -->
        <rect width="900" height="100" x="0" y="0" fill="#A51931" />
        <!-- Upper White Stripe (1/6) -->
        <rect width="900" height="100" x="0" y="100" fill="#F4F5F8" />
        <!-- Center Deep Navy Blue Stripe (2/6) -->
        <rect width="900" height="200" x="0" y="200" fill="#2D2A4A" />
        <!-- Lower White Stripe (1/6) -->
        <rect width="900" height="100" x="0" y="400" fill="#F4F5F8" />
        <!-- Bottom Crimson Red Stripe (1/6) -->
        <rect width="900" height="100" x="0" y="500" fill="#A51931" />
      </svg>

      <h2 class="th-banner-heading">
        A TASTE OF THAILAND,
        <span>SOMETHING FOR EVERY HOME</span>
      </h2>
    </div>

    <!-- Right Zone: Raw Pad Thai Rice Noodles, Thai Hom Mali Jasmine Rice, Lemongrass & Galangal, Thai Chillies & Holy Basil -->
    <div class="th-banner-right">
      <div class="th-ingredients-grid">
        <div class="ing-tile ing-noodles">
          <img
            src="https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?auto=format&fit=crop&w=600&q=85"
            alt="Raw dried Thai pad thai sen lek rice noodles"
            loading="eager"
          />
        </div>
        <div class="ing-tile ing-rice">
          <img
            src="https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=600&q=85"
            alt="Uncooked raw white Thai Hom Mali jasmine rice grains"
            loading="eager"
          />
        </div>
        <div class="ing-tile ing-lemongrass">
          <img
            src="https://images.unsplash.com/photo-1590502593747-42a996133562?auto=format&fit=crop&w=500&q=85"
            alt="Fresh Thai lemongrass stalks, galangal, and kaffir lime"
            loading="eager"
          />
        </div>
        <div class="ing-tile ing-chillies">
          <img
            src="https://images.unsplash.com/photo-1596040033229-a9821ebd058d?auto=format&fit=crop&w=500&q=85"
            alt="Raw dried Thai bird's eye chillies, turmeric, and aromatic spices"
            loading="eager"
          />
        </div>
        <div class="ing-tile ing-basil">
          <img
            src="https://images.unsplash.com/photo-1588879460618-9249e7d947d1?auto=format&fit=crop&w=500&q=85"
            alt="Fresh green Thai holy basil leaves and coriander"
            loading="eager"
          />
        </div>
      </div>
    </div>
  </section>

</body>
</html>
