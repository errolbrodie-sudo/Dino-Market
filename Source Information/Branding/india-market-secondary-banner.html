<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indian Market Secondary Page Banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       SECONDARY E-COMMERCE PAGE BANNER — INDIAN MARKET (ULTRA-FLAT)
       Desktop: 1440 x 150px | Tablet: 768 x 130px | Mobile: 375 x 165px
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    body {
      background-color: #f4f1ec;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .india-secondary-banner {
      position: relative;
      display: flex;
      width: 100%;
      max-width: 1440px;
      height: 150px;
      background-color: #EBD6B8;
      border: 1px solid #E4D5C0;
      overflow: hidden;
    }

    /* Left Marketing Zone (52%) with 9-Step Fine Color-Graded Background */
    .india-banner-left {
      position: relative;
      z-index: 2;
      flex: 0 0 52%;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 28px 0 44px;
      background: linear-gradient(
        90deg,
        #FAF6F0 0%,      #FAF6F0 11.11%,
        #F8F2E9 11.11%,  #F8F2E9 22.22%,
        #F6EEE2 22.22%,  #F6EEE2 33.33%,
        #F4EADB 33.33%,  #F4EADB 44.44%,
        #F2E5D4 44.44%,  #F2E5D4 55.55%,
        #F0E1CD 55.55%,  #F0E1CD 66.66%,
        #EEDDC6 66.66%,  #EEDDC6 77.77%,
        #ECD9BF 77.77%,  #ECD9BF 88.88%,
        #EBD6B8 88.88%,  #EBD6B8 100%
      );
    }

    /* Sharp Flat Indian National Flag */
    .india-banner-flag {
      flex-shrink: 0;
      width: 64px;
      height: 42px;
      border: 1px solid rgba(34, 25, 18, 0.16);
      display: block;
    }

    /* Two-Color Marketing Heading */
    .india-banner-heading {
      font-size: 23px;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: #221912;
    }

    .india-banner-heading span {
      display: block;
      color: #C84B11;
    }

    /* Right Raw Ingredients Zone (48%) */
    .india-banner-right {
      position: relative;
      flex: 0 0 48%;
      height: 100%;
      background-color: #EBD6B8;
      overflow: hidden;
    }

    /* Smooth Alpha Feather Blend from Left Step-Down Zone into Raw Ingredients */
    .india-banner-right::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 110px;
      background: linear-gradient(90deg, #EBD6B8 0%, rgba(235, 214, 184, 0) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* 5-Panel Editorial Collage of Raw Indian Ingredients */
    .india-ingredients-grid {
      display: grid;
      grid-template-columns: 1.15fr 1.05fr 0.9fr 0.9fr;
      grid-template-rows: 1fr 1fr;
      gap: 2px;
      width: 100%;
      height: 100%;
      background-color: #EBD6B8;
    }

    .ing-tile {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #E5CFAF;
    }

    .ing-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Panel Layout Assignments */
    .ing-noodles { grid-column: 1 / 2; grid-row: 1 / 3; }
    .ing-rice    { grid-column: 2 / 3; grid-row: 1 / 3; }
    .ing-spices  { grid-column: 3 / 4; grid-row: 1 / 2; }
    .ing-dal     { grid-column: 3 / 4; grid-row: 2 / 3; }
    .ing-herbs   { grid-column: 4 / 5; grid-row: 1 / 3; }

    /* Tablet Breakpoint (768 x 130px) */
    @media (max-width: 1024px) {
      .india-secondary-banner {
        height: 130px;
      }
      .india-banner-left {
        flex: 0 0 54%;
        gap: 16px;
        padding: 0 18px 0 24px;
      }
      .india-banner-flag {
        width: 52px;
        height: 34px;
      }
      .india-banner-heading {
        font-size: 17px;
      }
      .india-banner-right {
        flex: 0 0 46%;
      }
      .india-banner-right::before {
        width: 72px;
      }
    }

    /* Mobile Breakpoint (375 x 165px) */
    @media (max-width: 640px) {
      .india-secondary-banner {
        flex-direction: column;
        height: 165px;
      }
      .india-banner-left {
        flex: 0 0 54%;
        width: 100%;
        gap: 12px;
        padding: 10px 14px;
      }
      .india-banner-flag {
        width: 38px;
        height: 25px;
      }
      .india-banner-heading {
        font-size: 13.5px;
        line-height: 1.2;
      }
      .india-banner-right {
        flex: 0 0 46%;
        width: 100%;
      }
      .india-banner-right::before {
        inset: 0 0 auto 0;
        width: 100%;
        height: 22px;
        background: linear-gradient(180deg, #EBD6B8 0%, rgba(235, 214, 184, 0) 100%);
      }
      .india-ingredients-grid {
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: 1fr;
      }
      .ing-noodles { grid-column: 1 / 2; grid-row: 1 / 2; }
      .ing-rice    { grid-column: 2 / 3; grid-row: 1 / 2; }
      .ing-spices  { grid-column: 3 / 4; grid-row: 1 / 2; }
      .ing-dal     { grid-column: 4 / 5; grid-row: 1 / 2; }
      .ing-herbs   { grid-column: 5 / 6; grid-row: 1 / 2; }
    }
  </style>
</head>
<body>

  <section class="india-secondary-banner" aria-label="A Taste of India, Something for Every Home">
    <!-- Left Zone: Enlarged Flat Indian Flag + Two-Color Heading on 9-Step Background -->
    <div class="india-banner-left">
      <svg class="india-banner-flag" viewBox="0 0 900 600" role="img" aria-label="National Flag of India">
        <rect width="900" height="200" y="0" fill="#FF9933" />
        <rect width="900" height="200" y="200" fill="#FFFFFF" />
        <rect width="900" height="200" y="400" fill="#138808" />
        <g transform="translate(450, 300)">
          <circle r="92" fill="none" stroke="#000080" stroke-width="11" />
          <circle r="16" fill="#000080" />
          <g id="ashoka-spokes" stroke="#000080" stroke-width="5">
            <line x1="0" y1="-92" x2="0" y2="92" />
            <line x1="-92" y1="0" x2="92" y2="0" />
            <line x1="-65" y1="-65" x2="65" y2="65" />
            <line x1="-65" y1="65" x2="65" y2="-65" />
            <line x1="-23.8" y1="-88.9" x2="23.8" y2="88.9" />
            <line x1="-46" y1="-79.7" x2="46" y2="79.7" />
            <line x1="-79.7" y1="-46" x2="79.7" y2="46" />
            <line x1="-88.9" y1="-23.8" x2="88.9" y2="23.8" />
            <line x1="-88.9" y1="23.8" x2="88.9" y2="-23.8" />
            <line x1="-79.7" y1="46" x2="79.7" y2="-46" />
            <line x1="-46" y1="79.7" x2="46" y2="-79.7" />
            <line x1="-23.8" y1="88.9" x2="23.8" y2="-88.9" />
          </g>
        </g>
      </svg>

      <h2 class="india-banner-heading">
        A TASTE OF INDIA,
        <span>SOMETHING FOR EVERY HOME</span>
      </h2>
    </div>

    <!-- Right Zone: Raw Noodles, Raw Basmati Rice, Whole Spices, Dal & Fresh Coriander -->
    <div class="india-banner-right">
      <div class="india-ingredients-grid">
        <div class="ing-tile ing-noodles">
          <img
            src="https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?auto=format&fit=crop&w=600&q=85"
            alt="Raw dried golden wheat noodles"
            loading="eager"
          />
        </div>
        <div class="ing-tile ing-rice">
          <img
            src="https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=600&q=85"
            alt="Uncooked raw long-grain Indian basmati rice"
            loading="eager"
          />
        </div>
        <div class="ing-tile ing-spices">
          <img
            src="https://images.unsplash.com/photo-1596040033229-a9821ebd058d?auto=format&fit=crop&w=500&q=85"
            alt="Raw turmeric, Kashmiri red chilli, cumin, and cardamom spices"
            loading="eager"
          />
        </div>
        <div class="ing-tile ing-dal">
          <img
            src="https://images.unsplash.com/photo-1515543904379-3d757afe72e4?auto=format&fit=crop&w=500&q=85"
            alt="Raw yellow toor dal lentils and whole pulses"
            loading="eager"
          />
        </div>
        <div class="ing-tile ing-herbs">
          <img
            src="https://images.unsplash.com/photo-1588879460618-9249e7d947d1?auto=format&fit=crop&w=500&q=85"
            alt="Fresh raw coriander leaves and green chillies"
            loading="eager"
          />
        </div>
      </div>
    </div>
  </section>

</body>
</html>
